<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方块足球 BLOCKBALL — 第一人称足球</title>
<style>
  :root {
    --bg: #0a0f14;
    --fg: #e8eef6;
    --accent: #4be08a;
    --blue: #3f8cff;
    --red: #ff5a4d;
    --dim: #7d8899;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD（由 src/ui/hud.ts 注入内容，这里只给容器） ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 11;
    box-shadow: inset 0 0 200px 30px rgba(0,0,0,0.55);
    opacity: 0.85;
  }

  /* ---- 覆盖层：开始 / 结算 ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 12, 10, 0.86); backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }
  .panel {
    width: min(560px, 88vw); padding: 28px 32px;
    border: 1px solid rgba(75,224,138,0.35); border-radius: 14px;
    background: linear-gradient(160deg, rgba(16,28,24,0.96), rgba(8,14,12,0.96));
    box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  }
  .panel h1 {
    margin: 0 0 4px; font-size: 30px; letter-spacing: 3px; font-weight: 700;
    color: var(--accent); text-transform: uppercase;
  }
  .panel h2 { margin: 0 0 18px; font-size: 14px; font-weight: 500; color: var(--dim); letter-spacing: 1px; }
  .panel p { margin: 10px 0; font-size: 14px; line-height: 1.7; color: #c4cdda; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 16px 0 8px; font-size: 13px; }
  .keys b {
    color: var(--fg); background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 5px;
    padding: 1px 8px; font-weight: 600; justify-self: start; font-size: 12px;
  }
  .keys span { color: #aab4c4; align-self: center; }
  .btn {
    margin-top: 20px; width: 100%; padding: 13px; cursor: pointer;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    color: #0a1a12; background: var(--accent); border: 0; border-radius: 9px;
    font-family: inherit; transition: filter 120ms, transform 120ms;
  }
  .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .stats { margin-top: 14px; font-size: 13px; color: #96a1b2; line-height: 1.9; }
  .stats b { color: var(--fg); font-weight: 600; }
  .hint { margin-top: 14px; font-size: 12px; color: #6c7788; text-align: center; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="vignette"></div>

  <div id="overlay">
    <div class="panel" id="panel">
      <h1>方块足球 BLOCKBALL</h1>
      <h2>第一人称足球 · 方块人 · 拟真球物理</h2>
      <p>1v1 + 守门员。把球踢进对方球门，先进 <b>5 球</b>者胜。</p>
      <div class="keys">
        <b>W A S D</b><span>移动 · <b>Shift</b> 疾跑 · <b>空格</b> 跳跃</span>
        <b>鼠标</b><span>转视角 · <b>左键按住</b> 蓄力 · <b>松开</b> 踢球</span>
        <b>Esc</b><span>释放鼠标 · <b>Enter</b> 结算后重开</span>
      </div>
      <p style="color:#8892a3;font-size:13px">
        球贴脚时自动带球；靠近球按住左键蓄力，松开按视角方向踢出。旋转会产生弧线。
      </p>
      <button class="btn" id="start-btn">点击开始</button>
      <div class="hint">开始后鼠标将被锁定，按 Esc 释放</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
