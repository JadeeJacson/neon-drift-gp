<style>

#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

#banner b{display:block;font-family:'Press Start 2P';font-size:54px;color:#fff;text-shadow:5px 5px 0 #000}

.btn{pointer-events:auto;cursor:pointer;display:inline-block;font-size:23px;letter-spacing:4px;color:#fff;background:#3d8b40;padding:13px 46px;border:3px solid #000;box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -5px 0 rgba(0,0,0,.35),0 5px 0 rgba(0,0,0,.45)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -5px 0 rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.45)}
.tip{margin-top:18px;font-size:15px;color:#8b98a5;letter-spacing:1px}
#endTitle{font-size:52px;text-shadow:3px 3px 0 #000;margin-bottom:12px}
#endSub{font-size:22px;color:#dfe6ec;margin-bottom:30px;letter-spacing:2px}
</style>

<div id="hud">
  <div id="scoreboard" class="pxpanel">
    <span class="tag blue">蓝</span><b id="s1">0</b><i>:</i><b id="s2">0</b><span class="tag red">红</span><em id="clock">3:00</em>

<div id="overlay">

    <div class="help pxpanel">
      <kbd>鼠标</kbd> 视角 &nbsp;<kbd>左键</kbd> 按住蓄力 / 松开踢球，踢球瞬间按 <kbd>A</kbd><kbd>D</kbd> 可踢出弧线球<br>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;<kbd>Shift</kbd> 冲刺 &nbsp;<kbd>Space</kbd> 跳跃<br>

      你（蓝）与队友 2 名争球手 + 1 名后卫对抗红方同构阵容，3 分钟内进球多者胜
    </div><br>

<script type="module">
import * as THREE from 'three';

/* ================= 常量与工具 ================= */
const HW=20, HL=32;                 // 场地半宽 / 半长
const GHW=3.5, GH=2.44, GD=1.9;     // 球门半宽 / 高 / 网 deep
const POST_R=0.07, BR=0.34, GRAV=21;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const hDist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const fmt=t=>{t=Math.ceil(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
function lerpAngle(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*Math.min(1,t);}
const TV1=new THREE.Vector3(),TV2=new THREE.Vector3(),TV3=new THREE.Vector3(),TV4=new THREE.Vector3();
const EUL=new THREE.Euler(0,0,0,'YXZ');

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ecbe8);
scene.fog=new THREE.Fog(0x9ecbe8,110,260);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.05,500);

scene.add(new THREE.AmbientLight(0xdfe8f0,0.6));
scene.add(new THREE.HemisphereLight(0xbfd9f2,0x3c6b34,0.5));
const sun=new THREE.DirectionalLight(0xfff3dd,1.4);
sun.position.set(35,55,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:10,far:140});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias=-0.0006;
scene.add(sun);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ================= 程序化纹理 ================= */
function makeCanvas(w,h,fn,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}
  return t;
}
function grassTex(){return makeCanvas(128,128,g=>{
  for(let y=0;y<8;y++){g.fillStyle=y%2?'#3e7c33':'#478c3b';g.fillRect(0,y*16,128,16);}
  for(let i=0;i<1100;i++){g.fillStyle=Math.random()<0.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.08)';g.fillRect(Math.random()*128|0,Math.random()*128|0,1,1);}
},[3,4]);}
function ballTex(){return makeCanvas(128,64,g=>{
  g.fillStyle='#f2f2ee';g.fillRect(0,0,128,64);
  g.fillStyle='#1c1c1e';
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){
    const cx=c*32+(r%2?16:0)+8,cy=r*21+10,rot=r+c;
    g.beginPath();
    for(let k=0;k<5;k++){const a=k/5*Math.PI*2+rot;const x=cx+Math.cos(a)*9,y=cy+Math.sin(a)*9;k?g.lineTo(x,y):g.moveTo(x,y);}
    g.closePath();g.fill();
  }
});}
function faceTex(skin,hair,eye){return makeCanvas(8,8,g=>{
  g.fillStyle=skin;g.fillRect(0,0,8,8);
  g.fillStyle=hair;g.fillRect(0,0,8,2);g.fillRect(0,2,1,1);g.fillRect(7,2,1,1);
  g.fillStyle='#fff';g.fillRect(1,4,1,1);g.fillRect(6,4,1,1);
  g.fillStyle=eye;g.fillRect(2,4,1,1);g.fillRect(5,4,1,1);
  g.fillStyle='rgba(0,0,0,.14)';g.fillRect(3,5,2,1);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(3,6,2,1);
});}
function sideHeadTex(skin,hair){return makeCanvas(8,8,g=>{g.fillStyle=skin;g.fillRect(0,0,8,8);g.fillStyle=hair;g.fillRect(0,0,8,5);});}
function netTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;
  for(let i=0;i<=64;i+=8){g.beginPath();g.moveTo(i,0);g.lineTo(i,64);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(64,i);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t;}
function adTex(){return makeCanvas(512,64,g=>{
  g.fillStyle='#151b22';g.fillRect(0,0,512,64);
  g.fillStyle='#2a3644';for(let x=0;x<512;x+=16)g.fillRect(x,60,10,4);
  g.fillStyle='#ffd23f';g.font='bold 30px sans-serif';g.textBaseline='middle';
  g.fillText('BLOCK GOAL  •  3 V 3  •  BLOCK GOAL',14,34);
},[3,1]);}
const lam=c=>new THREE.MeshLambertMaterial({color:c});

/* ================= 球场搭建 ================= */
const outer=new THREE.Mesh(new THREE.PlaneGeometry(240,240),lam(0x356729));
outer.rotation.x=-Math.PI/2;outer.receiveShadow=true;scene.add(outer);
const pitchMesh=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,HL*2),new THREE.MeshLambertMaterial({map:grassTex()}));
pitchMesh.rotation.x=-Math.PI/2;pitchMesh.position.y=0.02;pitchMesh.receiveShadow=true;scene.add(pitchMesh);

const lineMat=new THREE.MeshLambertMaterial({color:0xf2f6ef,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
function whiteLine(cx,cz,w,d){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),lineMat);m.rotation.x=-Math.PI/2;m.position.set(cx,0.05,cz);scene.add(m);}
whiteLine(0,-HL,HW*2+0.12,0.12);whiteLine(0,HL,HW*2+0.12,0.12);
whiteLine(-HW,0,0.12,HL*2);whiteLine(HW,0,0.12,HL*2);whiteLine(0,0,0.12,HL*2);
const midRing=new THREE.Mesh(new THREE.RingGeometry(2.86,3.02,48),lineMat);midRing.rotation.x=-Math.PI/2;midRing.position.y=0.05;scene.add(midRing);
const spot=new THREE.Mesh(new THREE.CircleGeometry(0.16,12),lineMat);spot.rotation.x=-Math.PI/2;spot.position.y=0.05;scene.add(spot);
for(const s of [1,-1]){
  whiteLine(7*s,s*(HL-3.3),0.12,6.6);whiteLine(-7*s,s*(HL-3.3),0.12,6.6);whiteLine(0,s*(HL-6.6),14.12,0.12);
  whiteLine(3.5*s,s*(HL-1.2),0.12,2.4);whiteLine(-3.5*s,s*(HL-1.2),0.12,2.4);whiteLine(0,s*(HL-2.4),7.12,0.12);
  const p=new THREE.Mesh(new THREE.CircleGeometry(0.14,12),lineMat);p.rotation.x=-Math.PI/2;p.position.set(0,0.05,s*(HL-5.5));scene.add(p);
}
/* 球门 */
const netMaterialBase=netTex();
function makeNetPlane(w,h,ru,rv){
  const t=netMaterialBase.clone();t.needsUpdate=true;t.repeat.set(ru,rv);
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:0.85}));
}
const postMat=lam(0xf5f7f7), posts=[];
function addPosts(z){
  posts.push({a:new THREE.Vector3(-GHW,0,z),b:new THREE.Vector3(-GHW,GH,z)});
  posts.push({a:new THREE.Vector3(GHW,0,z),b:new THREE.Vector3(GHW,GH,z)});
  posts.push({a:new THREE.Vector3(-GHW,GH,z),b:new THREE.Vector3(GHW,GH,z)});
}
function buildGoal(side){
  const g=new THREE.Group();g.position.z=side*HL;
  for(const sx of [-1,1]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(POST_R,POST_R,GH+0.1,8),postMat);
    p.position.set(sx*GHW,GH/2,0);p.castShadow=true;g.add(p);
  }
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(POST_R,POST_R,GHW*2+0.14,8),postMat);
  bar.rotation.z=Math.PI/2;bar.position.y=GH;bar.castShadow=true;g.add(bar);
  const back=makeNetPlane(GHW*2+0.3,GH+0.1,15,5);back.position.set(0,GH/2,side*GD);g.add(back);
  for(const sx of [-1,1]){const s=makeNetPlane(GD,GH,4,5);s.rotation.y=Math.PI/2;s.position.set(sx*(GHW+0.15),GH/2,side*GD/2);g.add(s);}
  const top=makeNetPlane(GHW*2+0.3,GD,15,4);top.rotation.x=Math.PI/2;top.position.set(0,GH,side*GD/2);g.add(top);
  scene.add(g);addPosts(side*HL);
}
buildGoal(1);buildGoal(-1);
/* 角旗 */
function cornerFlag(x,z,ry){const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.6,6),lam(0xeeeeee));pole.position.y=0.8;
  const fl=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.24,0.02),lam(0xffd23f));fl.position.set(0.18,1.4,0);
  g.add(pole,fl);g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);}
cornerFlag(-HW,-HL,Math.PI/4);cornerFlag(HW,-HL,-Math.PI/4);cornerFlag(-HW,HL,3*Math.PI/4);cornerFlag(HW,HL,-3*Math.PI/4);
/* 广告板 */
const adT=adTex(), adMat=new THREE.MeshLambertMaterial({map:adT});
function adBoard(w,x,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,0.95),adMat);m.position.set(x,0.48,z);m.rotation.y=ry;scene.add(m);}
adBoard(HW*2+6,0,-HL-1.1,0);adBoard(HW*2+6,0,HL+1.1,Math.PI);adBoard(HL*2-8,-HW-1.1,0,Math.PI/2);adBoard(HL*2-8,HW+1.1,0,-Math.PI/2);
/* 看台 + 观众 */
const standMat=lam(0x59636e), seatGeo=new THREE.BoxGeometry(0.36,0.46,0.3), seatMat=new THREE.MeshLambertMaterial({color:0xffffff});
const seatColors=[0xc94f43,0x3f6bc9,0xe0c04a,0x4aa557,0x8a5fc9,0xd97f2e,0xcfd6dd,0x3ba3a0];
const standInsts=[], M4=new THREE.Matrix4();
function buildStand(cx,cz,rotY,length){
  const g=new THREE.Group();g.position.set(cx,0,cz);g.rotation.y=rotY;
  const seats=[];
  for(let i=0;i<4;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(length,0.95,1.6),standMat);
    b.position.set(0,0.47+i*0.82,1.2+i*1.55);b.receiveShadow=true;g.add(b);
    for(let x=-length/2+1;x<length/2-1;x+=0.55)
      if(Math.random()>0.13) seats.push({x:x+rand(-0.1,0.1),y:0.95+i*0.82+0.23,z:1.2+i*1.55,c:seatColors[Math.random()*seatColors.length|0]});
  }
  const inst=new THREE.InstancedMesh(seatGeo,seatMat,seats.length);
  seats.forEach((s,i)=>{M4.makeTranslation(s.x,s.y,s.z);inst.setMatrixAt(i,M4);inst.setColorAt(i,new THREE.Color(s.c));});
  g.add(inst);scene.add(g);
  standInsts.push({inst,seats});
}
buildStand(0,-(HL+3.8),Math.PI,72);buildStand(0,HL+3.8,0,72);
buildStand(HW+3.8,0,Math.PI/2,46);buildStand(-(HW+3.8),0,-Math.PI/2,46);
/* 方块云 */
const clouds=[];
for(let i=0;i<8;i++){
  const g=new THREE.Group();const n=2+(Math.random()*3|0);
  for(let j=0;j<n;j++){const b=new THREE.Mesh(new THREE.BoxGeometry(rand(4,8),1.1,rand(2.5,4)),lam(0xffffff));b.position.set(rand(-3,3),rand(-0.3,0.3),rand(-1.5,1.5));g.add(b);}
  g.position.set(rand(-85,85),rand(26,38),rand(-85,85));scene.add(g);clouds.push(g);
}

/* ================= 方块人 ================= */
function buildBlocky(cfg){
  const g=new THREE.Group();g.rotation.order='YXZ';
  const skinM=lam(cfg.skin),hairM=lam(cfg.hair),shirtM=lam(cfg.shirt),pantM=lam(cfg.pants),shoeM=lam(cfg.shoes);
  const faceM=new THREE.MeshLambertMaterial({map:faceTex(cfg.skin,cfg.hair,cfg.eye)});
  const sideM=new THREE.MeshLambertMaterial({map:sideHeadTex(cfg.skin,cfg.hair)});
  const headMats=[sideM,sideM,hairM,skinM,faceM,hairM];
  function leg(sx){
    const p=new THREE.Group();p.position.set(sx*0.128,0.78,0);
    const a=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.56,0.25),pantM);a.position.y=-0.28;a.castShadow=true;
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.27,0.24,0.32),shoeM);b.position.set(0,-0.66,0.03);b.castShadow=true;
    p.add(a,b);return p;
  }
  function arm(sx){
    const p=new THREE.Group();p.position.set(sx*0.375,1.5,0);
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.42,0.26),shirtM);s.position.y=-0.21;s.castShadow=true;
    const h=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.34,0.26),skinM);h.position.y=-0.59;h.castShadow=true;
    p.add(s,h);return p;
  }
  const legL=leg(-1),legR=leg(1),armL=arm(-1),armR=arm(1);
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.76,0.28),shirtM);torso.position.y=1.16;torso.castShadow=true;
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),headMats);head.position.y=1.79;head.castShadow=true;
  g.add(legL,legR,torso,armL,armR,head);
  return {group:g,legL,legR,armL,armR};
}
// side: -1 = 玩家方（蓝，守 -HL、攻 +HL）；+1 = 对方（红，守 +HL、攻 -HL）
// role: 'striker' 争球手 / 'defender' 后卫 / 'gk' 守门员
function makeActor(cfg,x,z,yaw,side=0,role='field'){
  const b=buildBlocky(cfg);
  b.group.position.set(x,0,z);b.group.rotation.y=yaw;scene.add(b.group);
  return {mesh:b.group,legL:b.legL,legR:b.legR,armL:b.armL,armR:b.armR,
    pos:b.group.position,yaw,vel:new THREE.Vector3(),speed:0,walkPhase:0,
    kickT:0,kickCd:0,haveT:0,stealT:0,tilt:0,dive:0,diveDir:0,reactDelay:0,targetX:0,holdT:0,saveCd:0,vy:0,
    side, isGK:role==='gk', role, supportX:0};
}
// 玩家方（蓝）：玩家争球手 + AI 争球手 + AI 后卫 + 守门员

/* ================= 音效（WebAudio 合成） ================= */
let AC=null,master,crowdGain,noiseBuf;
function initAudio(){
  if(AC){AC.resume&&AC.resume();return;}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.6;
  crowdGain=AC.createGain();crowdGain.gain.value=0.012;
  src.connect(bp);bp.connect(crowdGain);crowdGain.connect(master);src.start();
}
function noiseHit(dur,freq,vol,type='bandpass'){
  if(!AC)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
function sndKick(p){if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  g.gain.setValueAtTime(0.15+0.5*p,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.15);
  noiseHit(0.06,1400,0.12+0.25*p);}
function sndBounce(p){noiseHit(0.08,300,0.3*p);}
function sndStep(){noiseHit(0.045,500,0.05);}
function whoosh(){noiseHit(0.14,700,0.12,'highpass');}
function sndPost(){if(!AC)return;const t=AC.currentTime;
  [1250,1870].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.18/(i+1),t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.36);});}
function sndWhistle(n=1){if(!AC)return;
  for(let i=0;i<n;i++){const t=AC.currentTime+i*0.42;
    const o=AC.createOscillator();o.type='square';o.frequency.value=2350;
    const l=AC.createOscillator();l.frequency.value=38;const lg=AC.createGain();lg.gain.value=280;l.connect(lg);lg.connect(o.frequency);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.09,t+0.03);
    const dur=n===1?0.32:0.2;g.gain.setValueAtTime(0.09,t+dur);g.gain.exponentialRampToValueAtTime(0.001,t+dur+0.1);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.5);l.start(t);l.stop(t+0.5);}}
function sndGoal(){if(!AC)return;
  [523,659,784].forEach((f,i)=>{const t=AC.currentTime+i*0.12;
    const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(0.11,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);});
  cheer=1.5;}

/* ================= 核心机制 ================= */
function canKick(){
  if(ball.held||player.kickCd>0)return false;
  return hDist(player.pos,ball.pos)<1.6&&ball.pos.y<1.75;
}
function kickBall(a,dir,speed,spinY=0){
  const wasPoss=(possessor&&possessor!==a)?possessor:null;
  possessor=null;a.kickCd=0.5;a.kickT=0.32;a.haveT=0;
  const fx=Math.sin(a.yaw),fz=Math.cos(a.yaw);
  ball.pos.x+=fx*0.35;ball.pos.z+=fz*0.35;ball.pos.y=Math.max(ball.pos.y,BR);
  ball.vel.copy(dir).multiplyScalar(speed);
  if(ball.vel.length()>30)ball.vel.setLength(30);
  ball.spin.set(ball.vel.z,0,-ball.vel.x).multiplyScalar(0.55/BR);
  ball.spin.y+=spinY;
  sndKick(clamp(speed/26,0.25,1));
  if(a===player){shake=0.4+0.6*clamp(speed/26,0,1);if(wasPoss&&wasPoss!==player&&wasPoss.side!==a.side)toast('断球成功！');}
}
function tryKick(){
  const p=power;charging=false;
  if(canKick()){
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    dir.y=Math.max(dir.y,-0.12);dir.normalize();
    const ix=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    kickBall(player,dir,9.5+16.5*p,-ix*6.5*(0.35+0.65*p));
  }else{whoosh();player.kickT=0.32;}
}

/* ================= 场上球员 AI（双方通用，按 side / role 区分行为） ================= */
function moveActor(a,tx,tz,speed,dt){
  const dx=tx-a.pos.x,dz=tz-a.pos.z,d=Math.hypot(dx,dz);
  if(d>0.05&&speed>0){
    const k=1-Math.exp(-8*dt);
    a.vel.x+=(dx/d*speed-a.vel.x)*k;a.vel.z+=(dz/d*speed-a.vel.z)*k;
  }else{a.vel.x*=0.7;a.vel.z*=0.7;}
  a.pos.x+=a.vel.x*dt;a.pos.z+=a.vel.z*dt;
  a.speed=Math.hypot(a.vel.x,a.vel.z);
  if(a.speed>0.4)a.yaw=lerpAngle(a.yaw,Math.atan2(a.vel.x,a.vel.z),6*dt);
}
// 复位一名球员到指定站位（开球用）
function resetActor(a,x,z,yaw){
  a.pos.set(x,0,z);a.vel.set(0,0,0);a.vy=0;
  a.yaw=yaw;a.kickCd=0;a.kickT=0;a.haveT=0;a.stealT=0;a.tilt=0;
  a.dive=0;a.diveDir=0;a.holdT=0;a.saveCd=0;a.speed=0;
}
// 找一名更靠前、且未被盯死的队友作为传球点
function bestPassTarget(a){
  const side=a.side;
  const depthOf=p=>-side*p.z;                 // 越大越靠近对方球门
  let best=null,bestScore=-1e9;
  for(const b of actors){
    if(b===a||b.isGK||b.side!==side)continue;
    const adv=depthOf(b.pos)-depthOf(a.pos);
    if(adv<1.5)continue;                       // 必须明显更靠前
    let near=99;
    for(const o of actors){if(o.side===side||o.isGK)continue;near=Math.min(near,hDist(o.pos,b.pos));}
    if(near<2.2)continue;                      // 队友被贴死，不传
    const score=adv*2+near;
    if(score>bestScore){bestScore=score;best=b;}
  }
  return best;
}
function updateFieldActor(a,dt){
  a.kickCd-=dt;a.stealT-=dt;
  if(state==='goal'){moveActor(a,a.pos.x,a.pos.z,0,dt);return;}
  const side=a.side;
  const gdz=-side;                             // 朝对方球门的 z 方向（+1 / -1）
  const ownGZ=side*HL, atkZ=-side*HL;
  const hasBall=possessor===a;
  const enemyHasBall=possessor&&possessor.side!==side&&!possessor.isGK;
  const free=!possessor||possessor.isGK;
  if(hasBall){
    a.haveT+=dt;
    // 推进方向：朝对方球门，遇阻侧向绕开
    let dirX=0,dirZ=gdz,block=null,bd=2.4;
    for(const o of actors){if(o.isGK||o.side===side)continue;const d=hDist(o.pos,ball.pos);if(d<bd){bd=d;block=o;}}
    if(block){
      const bx=ball.pos.x-block.pos.x,bz=ball.pos.z-block.pos.z;
      const perpX=bx>0?-1:1;
      dirX=perpX*0.9;dirZ=gdz;const l=Math.hypot(dirX,dirZ);dirX/=l;dirZ/=l;
    }
    moveActor(a,a.pos.x+dirX*3,a.pos.z+dirZ*3,a.role==='defender'?6.4:7.2,dt);
    const dG=Math.abs(ball.pos.z-atkZ);
    if(a.haveT>0.35){
      // 1) 优先传球给更靠前的空位队友
      const mate=bestPassTarget(a);
      if(mate&&Math.random()<dt*2.0){
        const aim=new THREE.Vector3(mate.pos.x-ball.pos.x,0.25,mate.pos.z-ball.pos.z).normalize();
        kickBall(a,aim,clamp(hDist(ball.pos,mate.pos)*0.95,9,21),rand(-1.5,1.5));
        return;
      }
      // 2) 进入射程则起脚打门
      if(dG<22&&(Math.random()<dt*1.8||dG<8)){
        const aimX=clamp(ball.pos.x*0.35+rand(-2.6,2.6),-GHW+0.5,GHW-0.5);
        const aim=new THREE.Vector3(aimX-ball.pos.x,rand(0.25,1.9),atkZ-ball.pos.z).normalize();
        const pw=clamp(0.6-dG*0.012+rand(-0.08,0.08),0.32,0.95);
        kickBall(a,aim,14+16*pw,rand(-2.5,2.5));
        return;
      }
    }
  }else{
    a.haveT=0;
    let tx,tz,sp;
    if(a.role==='defender'){
      // 后卫：站在球与己方球门之间，对手持球逼近时上抢
      const bz=clamp(ball.pos.z+ball.vel.z*0.18,-HL+1,HL-1);
      const bx=clamp(ball.pos.x+ball.vel.x*0.18,-HW+1,HW-1);
      const t=0.30;
      tx=bx*(1-t);tz=bz*(1-t)+ownGZ*t;
      if(enemyHasBall&&hDist(a.pos,ball.pos)<13){tx=ball.pos.x+ball.vel.x*0.2;tz=ball.pos.z+ball.vel.z*0.2;}
      sp=7.3;
    }else{ // 争球手
      if(enemyHasBall||free){                  // 对手持球/自由球 → 追球或回抢
        tx=clamp(ball.pos.x+ball.vel.x*0.22,-HW+0.5,HW-0.5);
        tz=clamp(ball.pos.z+ball.vel.z*0.22,-HL+0.5,HL-0.5);
      }else{                                   // 队友持球 → 前插接应、拉开空当
        tx=clamp(ball.pos.x+a.supportX,-HW+1,HW-1);
        tz=clamp(ball.pos.z+gdz*10,-HL+0.5,HL-0.5);
      }
      sp=8.0;
    }
    moveActor(a,tx,tz,sp,dt);
    // 抢断：对持球的对手下手
    if(possessor&&possessor!==a&&!possessor.isGK&&possessor.side!==side&&a.stealT<=0&&hDist(a.pos,ball.pos)<1.25){
      const carrier=possessor;
      a.stealT=0.7;
      if(Math.random()<0.5){
        possessor=null;
        ball.vel.set(Math.sin(a.yaw)*4,0.8,Math.cos(a.yaw)*4);
        for(const b of actors)if(b.side!==side&&!b.isGK)b.kickCd=Math.max(b.kickCd,0.3);
        a.kickCd=0.15;
        if(carrier===player)toast('被抢断了！快追回来');
        sndKick(0.3);
      }
    }
  }
  a.pos.x=clamp(a.pos.x,-HW+0.4,HW-0.4);a.pos.z=clamp(a.pos.z,-HL+0.4,HL-0.4);
}

/* ================= 守门员 AI ================= */
function gkPunt(gk){
  const side=gk.side;
  const d=new THREE.Vector3(rand(-11,11)-gk.pos.x,0,-side*rand(2,14)-gk.pos.z).normalize();
  ball.held=false;possessor=null;
  ball.pos.set(gk.pos.x+d.x*0.5,1.2,gk.pos.z+d.z*0.5);
  ball.vel.set(d.x*20,10.5,d.z*20);ball.spin.set(0,0,0);
  gk.kickCd=0.6;gk.kickT=0.32;
  sndKick(0.8);toast(gk===gkAway?'你的守门员大脚开球':'对方守门员大脚开球');
}
function updateGK(gk,dt){
  const side=gk.side,gz=side*HL;
  gk.kickCd-=dt;gk.saveCd-=dt;
  if(gk.holdT>0){                              // 抱球 → 开大脚
    gk.holdT-=dt;
    const fx=Math.sin(gk.yaw),fz=Math.cos(gk.yaw);
    ball.pos.set(gk.pos.x+fx*0.5,1.15,gk.pos.z+fz*0.5);
    ball.vel.set(0,0,0);ball.spin.set(0,0,0);
    gk.speed=0;syncBallMesh(dt);
    if(gk.holdT<=0)gkPunt(gk);
    return;
  }
  if(gk.dive>0){                               // 扑救中
    gk.dive-=dt;
    if(gk.reactDelay>0)gk.reactDelay-=dt;
    else{
      const dx=gk.targetX-gk.pos.x;
      if(Math.abs(dx)>0.05){gk.vel.x=Math.sign(dx)*10.5;gk.pos.x+=gk.vel.x*dt;}
      else gk.vel.x=0;
    }
    gk.pos.z=gz-side*0.7;
    gk.speed=Math.abs(gk.vel.x);
  }else{                                       // 常规站位
    let tx=clamp(ball.pos.x*0.55,-3.1,3.1);
    let tz=gz-side*(0.8+clamp((14-Math.abs(gz-ball.pos.z))*0.22,0,3.2));
    if(!possessor&&hDist(gk.pos,ball.pos)<7&&Math.abs(ball.pos.z-gz)<9&&Math.hypot(ball.vel.x,ball.vel.z)<7){tx=ball.pos.x;tz=ball.pos.z;}
    const dx=tx-gk.pos.x,dz=tz-gk.pos.z,d=Math.hypot(dx,dz);
    let sp=0;
    if(d>0.1){sp=Math.min(5.2,d*3);gk.pos.x+=dx/d*sp*dt;gk.pos.z+=dz/d*sp*dt;}
    gk.speed=sp;
    const vz=ball.vel.z;                       // 威胁检测 → 触发扑救
    if(vz*side>5&&Math.abs(gz-ball.pos.z)<24){
      const t=Math.abs(gz-ball.pos.z)/Math.abs(vz);
      const px=ball.pos.x+ball.vel.x*t, py=ball.pos.y+ball.vel.y*t-0.5*GRAV*t*t;
      if(Math.abs(px)<4.6&&py<2.8&&py>-1){
        gk.dive=1.0;gk.reactDelay=rand(0.05,0.2);
        gk.targetX=clamp(px,-3.5,3.5);
        gk.diveDir=Math.sign(px-gk.pos.x)||1;
      }
    }
  }
  if(side>0)gk.pos.z=clamp(gk.pos.z,HL-4,HL+0.3);else gk.pos.z=clamp(gk.pos.z,-HL-0.3,-HL+4);
  gk.pos.x=clamp(gk.pos.x,-GHW-1.2,GHW+1.2);
  gk.yaw=lerpAngle(gk.yaw,Math.atan2(ball.pos.x-gk.pos.x,-side),6*dt);
  const hit=collideBallActor(gk,gk.dive>0?1.25:0.55,2.1);   // 身体挡球
  if(hit&&possessor!==gk){
    const sp=ball.vel.length();
    if(sp<8&&gk.dive<=0){
      possessor=gk;gk.holdT=1.5;ball.held=true;ball.vel.set(0,0,0);ball.spin.set(0,0,0);
      toast(gk===gkAway?'你的守门员将球没收':'对方守门员将球没收');
    }else if(sp>=8&&gk.saveCd<=0){
      gk.saveCd=1.2;
      toast(gk===gkAway?'你的守门员扑出险球！':'对方守门员扑出射门！');
    }
  }
}

/* ================= 球物理 ================= */
let possessor=null;
function collideBallActor(a,r,h){
  if(a.kickCd>0.12)return false;
  const dx=ball.pos.x-a.pos.x,dz=ball.pos.z-a.pos.z;
  const d=Math.hypot(dx,dz),rr=r+BR;
  if(d<rr&&d>1e-4&&ball.pos.y<h){
    const nx=dx/d,nz=dz/d;
    ball.pos.x=a.pos.x+nx*rr;ball.pos.z=a.pos.z+nz*rr;
    const vn=ball.vel.x*nx+ball.vel.z*nz;
    if(vn<0){ball.vel.x-=1.55*vn*nx;ball.vel.z-=1.55*vn*nz;sndBounce(clamp(-vn/15,0.1,0.6));}
    return true;
  }
  return false;
}
function collideSegments(){
  for(const s of posts){
    TV1.subVectors(s.b,s.a);
    const t=clamp(TV2.subVectors(ball.pos,s.a).dot(TV1)/TV1.lengthSq(),0,1);
    TV3.copy(s.a).addScaledVector(TV1,t);
    const d=ball.pos.distanceTo(TV3),rr=BR+POST_R;
    if(d<rr&&d>1e-5){
      TV4.subVectors(ball.pos,TV3).divideScalar(d);
      ball.pos.copy(TV3).addScaledVector(TV4,rr);
      const vn=ball.vel.dot(TV4);
      if(vn<0){ball.vel.addScaledVector(TV4,-1.7*vn);sndPost();}
    }
  }
}
function stepBall(dt){
  if(ball.held){syncBallMesh(dt);return;}
  if(possessor&&!possessor.isGK){              // 带球：球吸附在脚下（任一非门将球员）
    const a=possessor;
    const ahead=a===player?(sprintNow?1.05:0.8):0.78;
    const fx=Math.sin(a.yaw),fz=Math.cos(a.yaw);
    const k=1-Math.exp(-11*dt);
    ball.pos.x+=(a.pos.x+fx*ahead-ball.pos.x)*k;
    ball.pos.z+=(a.pos.z+fz*ahead-ball.pos.z)*k;
    ball.pos.y=BR;
    ball.vel.set(a.vel.x,0,a.vel.z);
    ball.spin.set(ball.vel.z/BR,0,-ball.vel.x/BR);
    syncBallMesh(dt);return;
  }
  // 自由飞行 / 滚动
  ball.vel.y-=GRAV*dt;
  if(ball.spin.lengthSq()>0.01){               // 马格努斯效应（弧线）
    TV1.crossVectors(ball.spin,ball.vel).multiplyScalar(0.05);
    ball.vel.addScaledVector(TV1,dt);
  }
  ball.vel.multiplyScalar(Math.max(0,1-0.1*dt));   // 空气阻力
  ball.spin.multiplyScalar(Math.max(0,1-0.4*dt));
  ball.pos.addScaledVector(ball.vel,dt);
  if(ball.pos.y<BR){                            // 地面碰撞
    ball.pos.y=BR;
    if(ball.vel.y<-2.2)sndBounce(clamp(-ball.vel.y/16,0.08,0.55));
    if(ball.vel.y<0){ball.vel.y*=-0.58;if(Math.abs(ball.vel.y)<1.7)ball.vel.y=0;}
    const f=Math.exp(-1.35*dt);ball.vel.x*=f;ball.vel.z*=f;   // 滚动摩擦
    ball.spin.set(ball.vel.z/BR,0,-ball.vel.x/BR);
  }
  collideSegments();
  for(const a of actors)if(!a.isGK)collideBallActor(a,0.5,1.95);
  if(ball.vel.length()>30)ball.vel.setLength(30);
  if(state==='goal'&&Math.abs(ball.pos.z)>HL){  // 进球后球被球网兜住
    const s=goalSide;
    if(ball.pos.z*s>HL+GD-0.15){ball.pos.z=s*(HL+GD-0.15);ball.vel.z*=-0.25;ball.vel.x*=0.5;}
    if(Math.abs(ball.pos.x)>GHW-0.02){ball.pos.x=Math.sign(ball.pos.x)*(GHW-0.02);ball.vel.x*=-0.3;}
    ball.vel.multiplyScalar(Math.max(0,1-2.5*dt));
  }
  syncBallMesh(dt);
}
function possessionLogic(){
  if(ball.held||possessor)return;
  for(const a of actors){
    if(a.isGK||a.kickCd>0)continue;
    if(hDist(a.pos,ball.pos)<0.85&&ball.pos.y<1.1&&Math.hypot(ball.vel.x,ball.vel.z)<7){
      possessor=a;a.haveT=0;return;
    }
  }
}

/* ================= 规则：进球 / 出界 ================= */
function onGoal(side){
  if(side>0){scoreP++;banner('GOAL!','蓝方得分','#6f9df5');}
  else{scoreA++;banner('GOAL!','红方得分','#e0655c');}
  updateScore();
  state='goal';goalT=2.6;slowT=0.85;cheer=1.5;goalSide=side;
  kickoffNext=side>0?'away':'player';
  sndWhistle(1);sndGoal();
}
function throwIn(){
  const sx=Math.sign(ball.pos.x)||1;
  ball.pos.set(sx*(HW-0.4),BR,clamp(ball.pos.z,-HL+1,HL-1));
  ball.vel.set(0,0,0);ball.spin.set(0,0,0);possessor=null;
  for(const a of actors)if(!a.isGK)a.kickCd=0.2;
  toast('界外球 · 快去抢球');
}
function goalKick(gk){
  ball.vel.set(0,0,0);ball.spin.set(0,0,0);
  possessor=gk;gk.holdT=1.4;ball.held=true;
  toast(gk===gkAway?'球门球':'对方球门球');
}
function checkGoalAndOut(){
  const p=ball.pos;
  if(p.z>HL+BR*0.4){(Math.abs(p.x)<GHW&&p.y<GH)?onGoal(1):goalKick(gkHome);return;}
  if(p.z<-(HL+BR*0.4)){(Math.abs(p.x)<GHW&&p.y<GH)?onGoal(-1):goalKick(gkAway);return;}
  if(Math.abs(p.x)>HW+BR*0.4)throwIn();
}
function separateActors(){
  for(let i=0;i<actors.length;i++)for(let j=i+1;j<actors.length;j++){
    const A=actors[i],B=actors[j];
    let dx=B.pos.x-A.pos.x,dz=B.pos.z-A.pos.z;const d=Math.hypot(dx,dz);
    if(d<0.68&&d>1e-4){const p=(0.68-d)/2;dx/=d;dz/=d;
      A.pos.x-=dx*p;A.pos.z-=dz*p;B.pos.x+=dx*p;B.pos.z+=dz*p;}
  }
}

/* ================= 玩家（第一人称） ================= */
function updatePlayer(dt){
  player.kickCd-=dt;
  const onG=player.pos.y<=0.0001;
  const ix=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const iz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw);
  const rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  let mx=fx*(-iz)+rx*ix,mz=fz*(-iz)+rz*ix;
  const ml=Math.hypot(mx,mz);if(ml>0.01){mx/=ml;mz/=ml;}
  sprintNow=(keys.ShiftLeft||keys.ShiftRight)&&ml>0.01&&!charging;
  const spd=(sprintNow?9.0:6.4)*(charging?0.55:1)*(possessor===player?0.93:1);
  const k=1-Math.exp(-11*dt);
  player.vel.x+=(mx*spd-player.vel.x)*k;
  player.vel.z+=(mz*spd-player.vel.z)*k;
  player.pos.x=clamp(player.pos.x+player.vel.x*dt,-HW-1.5,HW+1.5);
  player.pos.z=clamp(player.pos.z+player.vel.z*dt,-HL-1.5,HL+1.5);
  if(keys.Space&&onG){player.vy=7.6;player.pos.y=0.001;}
  player.vy-=GRAV*dt;player.pos.y+=player.vy*dt;
  if(player.pos.y<0){if(player.vy<-6)sndBounce(0.2);player.pos.y=0;player.vy=0;}
  player.yaw=camYaw+Math.PI;
  const hSpd=Math.hypot(player.vel.x,player.vel.z);
  player.speed=hSpd;
  if(onG)bobPhase+=hSpd*dt*1.65;
  bobY=Math.sin(bobPhase*2)*0.038*clamp(hSpd/8,0,1);
  stepAcc+=hSpd*dt;
  if(stepAcc>2.4&&onG&&hSpd>2){stepAcc=0;sndStep();}
  if(charging)power=Math.min(1,power+dt/0.85);
  shake=Math.max(0,shake-dt*2.5);
  camera.position.set(
    player.pos.x+(Math.random()-0.5)*shake*0.05,
    player.pos.y+1.62+bobY+(Math.random()-0.5)*shake*0.05,
    player.pos.z+(Math.random()-0.5)*shake*0.05);
  camera.quaternion.setFromEuler(EUL.set(pitch,camYaw,Math.sin(bobPhase)*0.01*clamp(hSpd/8,0,1)));
  const tf=75+(sprintNow?5:0)-(charging?6:0);
  camera.fov+=(tf-camera.fov)*Math.min(1,8*dt);
  camera.updateProjectionMatrix();
}

/* ================= 角色动画 ================= */
function animateActor(a,dt,t){
  const m=a.mesh;
  m.position.set(a.pos.x,a.pos.y||0,a.pos.z);
  m.rotation.set(0,a.yaw,a.tilt);
  a.walkPhase+=a.speed*dt*2.1;
  const sw=Math.sin(a.walkPhase)*clamp(a.speed/6.5,0,1)*0.8;
  a.legL.rotation.x=sw;a.legR.rotation.x=-sw;
  a.armL.rotation.x=-sw*0.85;a.armR.rotation.x=sw*0.85;
  if(a.kickT>0){                                 // 踢腿：后摆 → 前甩
    a.kickT-=dt;
    const q=1-Math.max(0,a.kickT)/0.32;let kr=0;
    if(q<0.22)kr=q/0.22*0.5;
    else if(q<0.75)kr=0.5-((q-0.22)/0.53)*2.05;
    else kr=-1.55+((q-0.75)/0.25)*1.55;
    a.legR.rotation.x=kr;
  }
  if(a.isGK){                                    // 守门员侧扑姿态
    const target=a.dive>0.18?-a.side*a.diveDir*1.15:0;
    a.tilt+=(target-a.tilt)*Math.min(1,12*dt);
    const az=a.dive>0.18?1.5:0;
    a.armL.rotation.z+=(az-a.armL.rotation.z)*Math.min(1,10*dt);
    a.armR.rotation.z+=(-az-a.armR.rotation.z)*Math.min(1,10*dt);
  }
  if(a.speed<0.4&&a.kickT<=0){                   // 站立呼吸
    a.armL.rotation.x+=Math.sin(t*1.7)*0.05;
    a.armR.rotation.x-=Math.sin(t*1.7)*0.05;
  }
}

/* ================= 比赛流程 ================= */
function kickoff(team){
  ball.held=false;possessor=null;slowT=0;
  ball.pos.set(0,BR,0);ball.vel.set(0,0,0);ball.spin.set(0,0,0);syncBallMesh();
  // 玩家方（蓝）阵型：争球手 + 争球手 + 后卫 + 守门员
  resetActor(player,0,-6,Math.PI);
  resetActor(mate1,-7,-10,Math.PI);
  resetActor(def1,0,-(HL-7),Math.PI);
  // 对方（红）阵型：同构
  resetActor(opp1,0,6,0);
  resetActor(opp2,7,10,0);
  resetActor(oppDef,0,HL-7,0);
  for(const gk of [gkHome,gkAway]){
    gk.pos.set(0,0,gk.side*(HL-0.8));gk.vel.set(0,0,0);
    gk.dive=0;gk.holdT=0;gk.tilt=0;gk.kickCd=0;gk.speed=0;
    gk.yaw=gk.side>0?Math.PI:0;
  }
  // 开球方中圈站位
  if(team==='player'){player.pos.set(0,0,-1.6);}
  else{opp1.pos.set(0,0,1.6);}
  camYaw=Math.PI;pitch=0;player.yaw=Math.PI;
  state='play';
  toast(team==='player'?'你的开球 · 冲向足球！':'对方开球');
  sndWhistle(1);
  if(firstKick){firstKick=false;setTimeout(()=>{if(state==='play')toast('按住左键蓄力，松开射门！');},1900);}
}
function startMatch(){scoreP=0;scoreA=0;time=180;firstKick=true;updateScore();clockEl.textContent=fmt(time);kickoff('player');}
function endMatch(){
  state='end';charging=false;document.exitPointerLock();
  sndWhistle(3);clockEl.textContent='0:00';
  const win=scoreP>scoreA,draw=scoreP===scoreA;
  $('endTitle').textContent=win?'胜利！':draw?'平局':'惜败…';
  $('endTitle').style.color=win?'#6f9df5':draw?'#d8c26a':'#e0655c';
  $('endSub').textContent=`最终比分 ${scoreP} : ${scoreA} · `+(win?'你战胜了红方块块队！':draw?'势均力敌，再来一局分出高下':'红方略胜一筹，再挑战一次！');
  showScreen('end');
}
$('btnStart').onclick=()=>{initAudio();startMatch();lock();};
$('btnResume').onclick=()=>{initAudio();lock();};
$('btnAgain').onclick=()=>{initAudio();startMatch();lock();};

/* ================= 环境（云 / 观众 / 人声） ================= */
function updateEnv(dt,t){
  for(const c of clouds){c.position.x+=dt*1.2;if(c.position.x>95)c.position.x=-95;}
  cheer=Math.max(0,cheer-dt*0.4);
  if(AC){const target=0.012+cheer*0.22;crowdGain.gain.value+=(target-crowdGain.gain.value)*Math.min(1,dt*3);}
  if(cheer>0.02){
    for(const s of standInsts){
      for(let i=0;i<s.seats.length;i++){
        const b=s.seats[i];
        M4.makeTranslation(b.x,b.y+Math.sin(t*11+b.x*2.1+b.z)*0.3*cheer,b.z);
        s.inst.setMatrixAt(i,M4);
      }
      s.inst.instanceMatrix.needsUpdate=true;
    }
  }
}
function orbitCam(t){
  const a=t*0.12;
  camera.position.set(Math.sin(a)*30,13,Math.cos(a)*30);
  camera.lookAt(0,1.2,0);
}

/* ================= 主循环 ================= */
function updateSim(dt,t){
  updatePlayer(dt);
  for(const a of actors)if(!a.isGK&&a!==player)updateFieldActor(a,dt);
  updateGK(gkHome,dt);
  updateGK(gkAway,dt);
  possessionLogic();
  stepBall(dt);
  separateActors();
  if(state==='play')checkGoalAndOut();
  for(const a of actors)animateActor(a,dt,t);
  ringEl.classList.toggle('on',state==='play'&&canKick());
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000)||0.016;lastT=now;
  const t=now/1000;
  if(state==='play'||state==='goal'){
    if(slowT>0)slowT-=dt;
    const sim=dt*(slowT>0?0.35:1);           // 进球瞬间慢动作
    if(state==='play'){
      time-=sim;
      if(time<=0){time=0;endMatch();}
      else clockEl.textContent=fmt(time);
    }else{
      goalT-=dt;
      if(goalT<=0)kickoff(kickoffNext);
    }
    updateSim(sim,t);
    powerWrap.style.display=charging?'block':'none';
    if(charging){powerFill.style.width=(power*100)+'%';powerFill.style.background=`hsl(${110-power*110} 85% 55%)`;}
  }else if(state==='menu'||state==='end'){
    orbitCam(t);
    ringEl.classList.remove('on');
    for(const a of actors){a.vel.multiplyScalar(0.9);a.speed=Math.max(0,a.speed-dt*6);animateActor(a,dt,t);}
  }
  updateEnv(dt,t);
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
