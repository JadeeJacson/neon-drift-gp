<style>

#info .lb{color:#678;white-space:nowrap}
#info .vl{color:#9cf;text-align:right;max-width:180px}

</style>
</head>

// ===== 纹理生成 =====
const texCache = {};
function makeTex(id, o) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = o.base || '#888'; x.fillRect(0, 0, 512, 256);
  if (o.bands) {
    const bh = 256 / o.bands.length;
    o.bands.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, i * bh, 512, bh + 1); });
    for (let i = 0; i < 400; i++) { x.globalAlpha = Math.random() * .08; x.fillStyle = Math.random() > .5 ? '#fff' : '#000'; x.beginPath(); x.ellipse(Math.random()*512, Math.random()*256, Math.random()*40+5, Math.random()*3+1, 0, 0, Math.PI*2); x.fill(); }
  }
  if (o.patches) {
    const pc = o.pc || 300, ps = o.ps || 20, pa = o.pa || 1;
    for (let i = 0; i < pc; i++) { x.globalAlpha = Math.random() * .3 + .05; x.fillStyle = o.patches[i % o.patches.length]; const r = Math.random() * ps + 2; x.beginPath(); x.ellipse(Math.random()*512, Math.random()*256, r, r*pa, Math.random()*Math.PI, 0, Math.PI*2); x.fill(); }
  }
  if (o.craters) {
    for (let i = 0; i < o.craters; i++) { const cx = Math.random()*512, cy = Math.random()*256, cr = Math.random()*4+1; x.globalAlpha = .2 + Math.random()*.2; x.fillStyle = '#444'; x.beginPath(); x.arc(cx, cy, cr, 0, Math.PI*2); x.fill(); x.globalAlpha = .3; x.strokeStyle = '#bbb'; x.lineWidth = .5; x.beginPath(); x.arc(cx, cy, cr+.5, 0, Math.PI*2); x.stroke(); }
  }
  if (o.extra) o.extra(x, 512, 256);
  x.globalAlpha = 1;
  texCache[id] = new THREE.CanvasTexture(c);
}

function build() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;                 // 真实阴影（昼夜分界 + 日食）
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.getElementById('hud'));

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000005);

  camera = new THREE.PerspectiveCamera(66, window.innerWidth / window.innerHeight, .05, 60000);
  camera.rotation.order = 'YXZ';

  // 太阳点光源：唯一主光源，投射阴影
  const sunLight = new THREE.PointLight(0xfff2e0, 2.4, 0, 1.6);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 2200;
  sunLight.shadow.bias = -0.0012;
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, .12));   // 极弱环境光，保留暗部细节

  raycaster = new THREE.Raycaster();

  buildTextures();
  buildStarfield();
  buildSun();
  buildPlanets();
  buildMoons();
  buildRings();
  buildAsteroids();
  buildOrbits();
  buildShip();
  initLabels();
  initUI();
  initInput();
  placeShipAtStart();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  loop();
}

function buildStarfield() {
  const N = 12000; const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 9000 + Math.random() * 18000; const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
    const t = Math.random();
    if (t < .15) { col[i*3]=1; col[i*3+1]=.7; col[i*3+2]=.5; }
    else if (t < .35) { col[i*3]=.7; col[i*3+1]=.8; col[i*3+2]=1; }
    else { const b=.5+Math.random()*.5; col[i*3]=b; col[i*3+1]=b; col[i*3+2]=b; }

function buildPlanets() {
  for (const [id, d] of Object.entries(DB)) {

    mesh.rotation.z = THREE.MathUtils.degToRad(d.tilt || 0);

    const angle = Object.keys(DB).indexOf(id) * Math.PI / 4;
    AB[id] = { mesh, def: d, angle, spin: 0 }; clickables.push(mesh);
  }

function buildMoons() {

function buildRings() {

function updateShip(dt) {
  ship.quat.setFromEuler(new THREE.Euler(ship.pitch, ship.yaw, ship.roll, 'YXZ'));
  _fwd.set(0, 0, -1).applyQuaternion(ship.quat);
  _rgt.set(1, 0, 0).applyQuaternion(ship.quat);
  _up.set(0, 1, 0).applyQuaternion(ship.quat);

  const boost = !!keys['shift'];
  const bk = boost ? 2.6 : 1;
  const canThrust = ship.fuel > 0 && !ship.engineCut;
  _acc.set(0, 0, 0); let thrusting = false;
  if (canThrust) {
    if (keys['w']) { _acc.addScaledVector(_fwd, THRUST * ship.throttle * bk); thrusting = true; }
    if (keys['s'] && ship.vel.lengthSq() > 0.02) { _acc.addScaledVector(_tmp.copy(ship.vel).normalize(), -BRAKE * (0.3 + ship.throttle)); thrusting = true; }
    if (keys['a']) { _acc.addScaledVector(_rgt, -STRAFE * ship.throttle); thrusting = true; }
    if (keys['d']) { _acc.addScaledVector(_rgt, STRAFE * ship.throttle); thrusting = true; }
    if (keys['r']) { _acc.addScaledVector(_up, LIFT * ship.throttle); thrusting = true; }
    if (keys['f']) { _acc.addScaledVector(_up, -LIFT * ship.throttle); thrusting = true; }
  }
  if (keys['q']) ship.roll += ROLL * dt;
  if (keys['e']) ship.roll -= ROLL * dt;

  // 燃料：推进消耗，惰性回充
  if (thrusting) ship.fuel = Math.max(0, ship.fuel - (keys['w'] ? 4.5 : 2.2) * dt * (boost ? 2.2 : 1));
  else ship.fuel = Math.min(100, ship.fuel + 3 * dt);
  ship.thrusting = thrusting; ship.boosting = thrusting && boost;

  ship.vel.addScaledVector(_acc, dt);
  ship.vel.multiplyScalar(1 - Math.min(0.35 * dt, 0.5)); // 轻微阻尼便于操控
  const maxS = 130 * bk; if (ship.vel.length() > maxS) ship.vel.setLength(maxS);
  ship.pos.addScaledVector(ship.vel, dt);
  shipMesh.position.copy(ship.pos); shipMesh.quaternion.copy(ship.quat);

  const g = thrusting ? (boost ? 2.6 : 1.6) : 0.55;
  engineGlow.scale.set(g, g, 1);
  engineGlow.material.color.setHex(boost && thrusting ? 0xffcf8a : 0x8fdcff);

  collide();
}
function collide() {
  for (const [id, a] of Object.entries(AB)) {
    if (id === 'sun') continue;
    a.mesh.getWorldPosition(_w);
    const safe = a.def.r + 2;
    const d = ship.pos.distanceTo(_w);
    if (d < safe) {
      _tmp.copy(ship.pos).sub(_w).normalize();
      ship.pos.copy(_w).addScaledVector(_tmp, safe + 0.5);
      ship.vel.multiplyScalar(0.15);
      warn('⚠ 规避碰撞');
    }
  }
}

function updateCamera(dt) {
  const k = 1 - Math.pow(0.0009, dt);
  if (viewMode === '1p') {
    shipMesh.visible = false;
    _eye.set(0, .35, -.6).applyQuaternion(ship.quat).add(ship.pos);
    camera.position.lerp(_eye, k);
    camera.quaternion.slerp(ship.quat, k);
  } else {
    shipMesh.visible = true;
    _des.set(0, 1.7, 7.5).applyQuaternion(ship.quat).add(ship.pos);
    camera.position.lerp(_des, k);
    _look.copy(ship.pos).addScaledVector(_fwd, 14);
    camera.lookAt(_look);
  }
}

// ===== 驾驶舱 HUD =====
let _warnT = 0, _toastT = 0;
function warn(msg) { const e = document.getElementById('warn'); e.textContent = msg; e.classList.add('show'); _warnT = performance.now() + 1200; }
function toast(msg) { const e = document.getElementById('toast'); e.textContent = msg; e.classList.add('show'); _toastT = performance.now() + 2600; }

function project(worldVec) {
  _tmp.copy(worldVec).project(camera);
  return { x: (_tmp.x * .5 + .5) * innerWidth, y: (-_tmp.y * .5 + .5) * innerHeight, front: _tmp.z < 1 };
}
function updateCockpit(now) {
  const speed = Math.round(ship.vel.length() * 10);
  const m = allDone ? null : MISSIONS[missionIdx];
  let dist = 0, tPos = null;
  if (m) { const t = AB[m.id]; t.mesh.getWorldPosition(_w); tPos = _w.clone(); dist = ship.pos.distanceTo(_w); }

  // 仪表数值（1p 与 3p 都需要）
  const fuelt = document.getElementById('fuelt'); if (fuelt) fuelt.textContent = Math.round(ship.fuel) + '%';
  const fb = document.getElementById('fuelbar'); if (fb) { fb.querySelector('i').style.width = ship.fuel + '%'; fb.classList.toggle('low', ship.fuel < 20); }
  const thrbar = document.getElementById('thrbar'); if (thrbar) thrbar.style.width = (ship.throttle * 100) + '%';
  const thrt = document.getElementById('thrt'); if (thrt) thrt.textContent = Math.round(ship.throttle * 100) + '%';
  const vnum = document.getElementById('vnum'); if (vnum) vnum.textContent = speed;
  const eng = document.getElementById('eng');
  if (eng) { const on = ship.thrusting; eng.className = on ? 'on' : 'off'; eng.textContent = ship.engineCut ? '引擎已切断' : (on ? (ship.boosting ? '▲ 加力推进' : '● 主推进') : '○ 引擎待机'); }
  const rdist = document.getElementById('rdist'); if (rdist) rdist.textContent = m ? (dist < 999 ? dist.toFixed(0) : (dist / AU).toFixed(2) + 'AU') : '—';

  // 任务条
  const msn = document.getElementById('msn');
  if (msn) msn.innerHTML = allDone ? '🛰 全部任务完成 · <span class="d">自由探索，点击天体查看资料</span>'
    : '任务 ' + (missionIdx + 1) + '/' + MISSIONS.length + '：<b>' + m.name + '</b> · <span class="d">抵达 ' + AB[m.id].def.n + ' 附近 ' + m.range + ' 单位内（还剩 ' + Math.max(0, dist - m.range).toFixed(0) + '）</span>';

  // 3p 角标
  const chip = document.getElementById('chip');
  if (chip) chip.innerHTML = '🚀 速度 ' + speed + ' m/s · 燃料 ' + Math.round(ship.fuel) + '% · 油门 ' + Math.round(ship.throttle * 100) + '%<br>' + (allDone ? '自由探索' : '目标：' + AB[m.id].def.n + ' · ' + (dist < 999 ? dist.toFixed(0) : (dist / AU).toFixed(2) + 'AU'));

  if (viewMode !== '1p') return;

  // 目标菱形标记（含屏幕外边缘指示）
  const tm = document.getElementById('tmark');
  if (tm && tPos) {
    const s = project(tPos); let px = s.x, py = s.y;
    const inb = s.front && px > 40 && px < innerWidth - 40 && py > 40 && py < innerHeight - 40;
    if (!inb) { const cx = innerWidth / 2, cy = innerHeight / 2; let dx = px - cx, dy = py - cy; if (!s.front) { dx = -dx; dy = -dy; } const hw = cx - 70, hh = cy - 70; const sc = Math.min(hw / (Math.abs(dx) || 1e-6), hh / (Math.abs(dy) || 1e-6)); px = cx + dx * sc; py = cy + dy * sc; }
    tm.style.display = ''; tm.style.left = px + 'px'; tm.style.top = py + 'px'; tm.style.transform = 'translate(-50%,-50%)';
  } else if (tm) tm.style.display = 'none';

  // 速度矢量标记
  const vm = document.getElementById('vmark');
  if (vm) {
    if (ship.vel.length() > 0.5) { _tmp.copy(ship.pos).addScaledVector(ship.vel, 2); const s = project(_tmp); const inb = s.front && s.x > 0 && s.x < innerWidth && s.y > 0 && s.y < innerHeight; vm.style.display = inb ? '' : 'none'; if (inb) { vm.style.left = s.x + 'px'; vm.style.top = s.y + 'px'; vm.style.transform = 'translate(-50%,-50%)'; } }
    else vm.style.display = 'none';
  }

  // 警告
  if (ship.fuel <= 0) warn('⛔ 燃料耗尽 · 惰性回充中');
  else if (ship.engineCut) warn('引擎已切断');
  if (_warnT && now > _warnT) { document.getElementById('warn').classList.remove('show'); _warnT = 0; }
  if (_toastT && now > _toastT) { document.getElementById('toast').classList.remove('show'); _toastT = 0; }
}

function toggleView() {
  viewMode = viewMode === '1p' ? '3p' : '1p';
  document.body.classList.toggle('view1p', viewMode === '1p');
  document.body.classList.toggle('view3p', viewMode === '3p');
  shipMesh.visible = viewMode === '3p';
}

// ===== 天体运动 =====
function updateBodies(dt) {
  const step = curScale() * dt;
  for (const [id, d] of Object.entries(DB)) {
    if (id === 'sun') continue;
    const a = AB[id]; a.angle += os(d.per) * step;
    a.mesh.position.set(Math.cos(a.angle) * d.o, 0, Math.sin(a.angle) * d.o);
    a.mesh.rotateY(d.rot * step);
  }
  AB.sun.spin += DB.sun.rot * step; AB.sun.mesh.rotation.y = AB.sun.spin;
  for (const [id, d] of Object.entries(MB)) {
    const a = AB[id], par = AB[d.p]; if (!par) continue;
    a.angle += d.sp * step; par.mesh.getWorldPosition(_tmp);
    a.mesh.position.set(_tmp.x + Math.cos(a.angle) * d.o, _tmp.y, _tmp.z + Math.sin(a.angle) * d.o);
    a.mesh.rotation.y += d.rot * step;
    if (a.orbitLine) a.orbitLine.position.copy(_tmp);
  }
}

// ===== 输入 =====
function initInput() {
  const cv = renderer.domElement; cv.style.cursor = 'grab';
  let mDn = false, moved = false, downX = 0, downY = 0, lX = 0, lY = 0;
  const ndc = new THREE.Vector2();

  cv.addEventListener('pointerdown', e => { mDn = true; moved = false; downX = lX = e.clientX; downY = lY = e.clientY; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointermove', e => {
    if (!mDn) return;
    const dx = e.clientX - lX, dy = e.clientY - lY; lX = e.clientX; lY = e.clientY;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) moved = true;
    ship.yaw -= dx * TURN; ship.pitch = Math.max(-1.5, Math.min(1.5, ship.pitch - dy * TURN));
  });
  cv.addEventListener('pointerup', e => {
    mDn = false; cv.style.cursor = 'grab'; try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved) return;
    ndc.x = (e.clientX / innerWidth) * 2 - 1; ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(clickables)[0];
    if (hit) select(hit.object.userData.id); else deselect();
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); ship.throttle = Math.max(0, Math.min(1, ship.throttle + (e.deltaY < 0 ? 0.06 : -0.06))); }, { passive: false });

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(); keys[k] = true;
    if (k === ' ') { e.preventDefault(); ship.engineCut = !ship.engineCut; }
    else if (k === 'v') toggleView();
    else if (k === 't') { showOrb = !showOrb; setOrbitsVisible(showOrb); }
    else if (k === 'n') { showLbl = !showLbl; setLabelsVisible(showLbl); }
    else if (k === 'm') { if (!allDone) { missionIdx = (missionIdx + 1) % MISSIONS.length; refreshUI(); } }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
}
const keys = {};

// ===== 主循环 =====
let lastT = 0, fps = 0, fa = 0, fn = 0;
function loop(t) {
  requestAnimationFrame(loop);
  t = (t || 0) / 1000; let dt = t - lastT; lastT = t; if (dt > 0.05) dt = 0.05;
  const now = performance.now();
  updateBodies(dt);
  updateShip(dt);
  updateCamera(dt);
  updateMission();
  updateLabels();
  updateCockpit(now);
  fa += dt; fn++; if (fa >= 0.5) { fps = Math.round(fn / fa); fa = 0; fn = 0; }
  renderer.render(scene, camera);
  if (!loaded) { loaded = true; const l = document.getElementById('load'); l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 600); }
}

// ===== 启动（含 three.js 备用 CDN 降级与看门狗） =====
function startGame() {
  try { build(); }
  catch (err) { showFatal(err); }
}
function showFatal(err) {
  const l = document.getElementById('load'); l.style.opacity = '1'; l.style.display = 'flex';
  l.innerHTML = '<div style="color:#ff8">⚠ 初始化失败</div><small style="color:#f88">' + (err && err.message ? err.message : err) + '</small><small>请刷新页面重试，或检查浏览器是否支持 WebGL</small>';
}
function loadFallback(list, i, ok, fail) {
  if (i >= list.length) return fail();
  const s = document.createElement('script'); s.src = list[i];
  s.onload = () => window.THREE ? ok() : loadFallback(list, i + 1, ok, fail);
  s.onerror = () => loadFallback(list, i + 1, ok, fail);
  document.head.appendChild(s);
}
function boot() {
  // 加载计时反馈，避免慢网下误以为卡死
  let sec = 0; const sub = document.getElementById('ldsub');
  const tk = setInterval(() => { sec++; if (sub && !loaded) sub.textContent = '首次加载 3D 引擎，已等待 ' + sec + 's…（网络较慢请耐心等待）'; if (loaded) clearInterval(tk); }, 1000);
  if (window.THREE) return startGame();
  document.getElementById('ldtxt').textContent = '📡 主源较慢，切换备用源…';
  loadFallback(['https://unpkg.com/three@0.128.0/build/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'], 0, startGame, () => {
    const l = document.getElementById('load'); l.style.opacity = '1';
    l.innerHTML = '<div style="color:#ff8">⚠ 无法加载 3D 引擎</div><small>three.js CDN 连接失败，请检查网络后刷新重试</small>';
  });
}
boot();
</script>
