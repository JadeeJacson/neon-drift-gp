<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2305070d%22/%3E%3Cpath d=%22M32 8 22 56h20z%22 fill=%22%23ff5a2a%22/%3E%3C/svg%3E" />
<meta name="description" content="TOKYO · 東京 —— 浏览器里的开放城市驾驶：赛道计时、地标打卡、跑腿派单、车库改装、昼夜循环。" />
<title>TOKYO · 東京 — 开放城市驾驶</title>
<style>
  :root {
    color-scheme: dark;
    --font: "Yu Gothic UI", "Meiryo", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --num: "Segoe UI", system-ui, -apple-system, sans-serif;
    --fg: #e8ecf4;
    --accent: #5b8cff;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  /* 作者样式里的 display 会盖过 UA 的 [hidden]{display:none}，这里统一兜底 */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; font-family: var(--font); color: var(--fg); }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  button { font-family: var(--font); }

  /* ---- 顶栏 ---- */
  #hud { position: fixed; top: calc(12px + var(--st)); left: calc(12px + var(--sl)); z-index: 10; max-width: calc(100vw - 200px); }
  #hud .title { font-size: 15px; letter-spacing: 2px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.8); display: flex; align-items: center; gap: 8px; }
  #hud .title small { opacity: .55; font-weight: 400; letter-spacing: 1px; }
  #hud .row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn, #hud button {
    appearance: none; border: 1px solid rgba(255,255,255,.22);
    background: rgba(10, 14, 24, .55); color: var(--fg);
    font: 12.5px/1 var(--font); padding: 6px 11px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #hud button:hover, .chip-btn:hover { background: rgba(60, 80, 130, .55); }
  #hud button.on { background: rgba(80, 130, 230, .75); border-color: rgba(160,200,255,.8); }
  #hud button.accent { background: rgba(70,120,225,.85); border-color: rgba(160,200,255,.7); }
  #hud .sep { width: 6px; }
  #menu-toggle { display: none; padding: 4px 10px !important; font-size: 16px !important; }
  #topright { position: fixed; top: calc(12px + var(--st)); right: calc(12px + var(--sr)); z-index: 11; display: flex; gap: 6px; align-items: center; }
  #money { font: 600 13px/1 var(--num); padding: 7px 11px; border-radius: 999px; background: rgba(10,14,24,.55); border: 1px solid rgba(255,215,106,.35); color: #ffd76a; text-shadow: 0 1px 4px #000; font-variant-numeric: tabular-nums; }
  #money.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  #pause-btn { font: 800 12px/1 var(--num); letter-spacing: -1px; width: 32px; height: 30px; padding: 0; }
  #fps { position: fixed; top: calc(50px + var(--st)); right: calc(14px + var(--sr)); z-index: 10; color: rgba(232,236,244,.55); font: 11px monospace; text-align: right; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #hint { position: fixed; bottom: calc(12px + var(--sb)); left: 50%; transform: translateX(-50%); z-index: 10; color: rgba(232,236,244,.6); font: 12px var(--font); text-shadow: 0 1px 6px rgba(0,0,0,.9); pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #loading { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #05070d; color: #9fb4d8; font: 14px var(--font); letter-spacing: 4px; transition: opacity .8s; }
  #loading .bar { width: 160px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden; border-radius: 2px; }
  #loading .bar::after { content: ""; display: block; height: 100%; width: 40%; background: var(--accent); animation: load 1.1s infinite ease-in-out; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #loading.done { opacity: 0; pointer-events: none; }

  /* ---- 驾驶 HUD ---- */
  #speedo { position: fixed; left: calc(18px + var(--sl)); bottom: calc(16px + var(--sb)); z-index: 10; display: flex; align-items: baseline; gap: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.9); pointer-events: none; }
  #speed-num { font: 700 52px/1 var(--num); font-variant-numeric: tabular-nums; }
  #speed-unit { font: 13px/1 var(--font); opacity: .7; }
  #drift-read { position: fixed; left: calc(18px + var(--sl)); bottom: calc(76px + var(--sb)); z-index: 10; font: 600 17px/1 var(--num); font-variant-numeric: tabular-nums; color: #ffd76a; text-shadow: 0 2px 10px rgba(0,0,0,.9); pointer-events: none; opacity: 0; transition: opacity .2s; }
  #objective { position: fixed; top: calc(76px + var(--st)); right: calc(14px + var(--sr)); z-index: 10; min-width: 190px; text-align: right; text-shadow: 0 2px 10px rgba(0,0,0,.9); pointer-events: none; }
  #obj-title { font: 600 13px/1.4 var(--font); letter-spacing: 1px; opacity: .95; }
  #obj-sub { font: 12px/1.4 var(--font); opacity: .7; margin-top: 2px; }
  #obj-extra { font: 12px/1.4 var(--num); color: #9fd8ff; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #obj-timer { font: 700 30px/1.1 var(--num); font-variant-numeric: tabular-nums; margin-top: 4px; }
  #obj-timer.urgent { color: #ff6a5e; animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
  #nav { position: fixed; top: calc(14px + var(--st)); left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(6,9,16,.5); border: 1px solid rgba(255,255,255,.14); pointer-events: none; text-shadow: 0 1px 4px #000; }
  #nav-arrow { width: 26px; height: 26px; display: grid; place-items: center; font-size: 20px; color: #4dffa6; transition: transform .08s linear; }
  #nav-label { font: 600 12.5px/1.2 var(--font); }
  #nav-dist { font: 12px/1.2 var(--num); opacity: .7; font-variant-numeric: tabular-nums; }
  #toasts { position: fixed; top: calc(64px + var(--st)); left: 50%; transform: translateX(-50%); z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { font: 600 15px/1.2 var(--font); padding: 8px 16px; border-radius: 10px; background: rgba(8,12,22,.72); border: 1px solid rgba(255,255,255,.16); text-shadow: 0 1px 4px #000; animation: tin .25s ease-out; transition: opacity .45s, transform .45s; white-space: nowrap; }
  .toast.good { border-color: rgba(77,255,166,.55); color: #b9ffd9; }
  .toast.gold { border-color: rgba(255,215,106,.6); color: #ffe7a6; }
  .toast.bad { border-color: rgba(255,106,94,.6); color: #ffc2bc; }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  #minimap { position: fixed; right: calc(14px + var(--sr)); bottom: calc(16px + var(--sb)); z-index: 10; width: 168px; height: 168px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(6,9,16,.55); opacity: .92; pointer-events: none; }
  #countdown { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; font: 800 130px/1 var(--num); color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.85); pointer-events: none; opacity: 0; }
  #countdown.show { opacity: 1; }
  #countdown.go { color: #7dff8a; }

  /* ---- 面板 ---- */
  #panel { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(4,6,12,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: var(--st) var(--sr) var(--sb) var(--sl); }
  #panel:has(.p-title) { background: linear-gradient(90deg, rgba(4,6,12,.82), rgba(4,6,12,.15) 70%); backdrop-filter: none; justify-content: flex-start; }
  .panel-card { width: min(580px, 92vw); max-height: 86vh; max-height: 86dvh; overflow-y: auto; background: rgba(12,16,26,.94); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 22px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.6); box-sizing: border-box; animation: pin .22s ease-out; }
  @keyframes pin { from { opacity: 0; transform: translateY(10px); } }
  .panel-card.p-title { background: transparent; border: 0; box-shadow: none; margin-left: max(4vw, 18px); width: min(380px, 90vw); }
  .panel-card h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: 2px; }
  .muted { font-size: 12.5px; opacity: .62; margin-bottom: 14px; line-height: 1.6; }
  .center { text-align: center; } .small { font-size: 11.5px; margin: 10px 0 0; }
  .sec { font-size: 12px; letter-spacing: 2px; opacity: .55; margin: 16px 0 8px; }
  .bl { font-size: 12px; opacity: .68; margin-top: 3px; line-height: 1.55; }
  .t-logo { font: 800 64px/1 var(--num); letter-spacing: 10px; background: linear-gradient(90deg, #fff, #9fc0ff 60%, #ff7ad9); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .t-sub { font-size: 13px; letter-spacing: 3px; opacity: .75; margin-top: 8px; }
  .t-stats { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 20px; }
  .pill { font: 12px/1 var(--num); padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
  .t-menu { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .t-menu .btn { text-align: left; }
  .card-btn { display: block; width: 100%; text-align: left; cursor: pointer; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 11px; padding: 11px 14px; margin-bottom: 9px; color: var(--fg); font: inherit; transition: background .15s, border-color .15s; box-sizing: border-box; }
  .card-btn:not(.static):not(.locked):hover { background: rgba(80,130,230,.18); border-color: rgba(150,190,255,.5); }
  .card-btn.static { cursor: default; }
  .card-btn.locked { opacity: .5; cursor: not-allowed; }
  .card-btn .row1, .card-btn .row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-btn .row2 { margin-top: 6px; font-size: 12px; }
  .nm { font-size: 15px; font-weight: 600; }
  .tag { font-size: 11px; opacity: .6; }
  .best { color: #7ee3a8; font-variant-numeric: tabular-nums; }
  .tgt { font: 11px var(--num); opacity: .5; margin-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tgt.got { opacity: 1; color: #ffe7a6; }
  .panel-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  /* 卡片底部的操作按钮钉在可视区底部，内容再长也不用滚到底才能点 */
  .panel-card > .panel-actions { position: sticky; bottom: -22px; margin: 14px -24px -22px; padding: 12px 24px 18px; background: linear-gradient(rgba(12,16,26,0), rgba(12,16,26,.97) 35%); }
  .btn { appearance: none; cursor: pointer; color: var(--fg); text-decoration: none; display: inline-block; box-sizing: border-box; background: rgba(30,44,70,.85); border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 10px 16px; font: 13.5px/1 var(--font); }
  .btn:hover:not([disabled]) { background: rgba(60,92,150,.9); }
  .btn.primary { background: rgba(70,120,225,.92); border-color: rgba(160,200,255,.7); }
  .btn.primary:hover { background: rgba(96,150,255,.95); }
  .btn.big { font-size: 16px; padding: 14px 18px; font-weight: 600; letter-spacing: 2px; }
  .btn.ghost { background: transparent; }
  .btn.danger { background: rgba(200,60,50,.85); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .res-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 14px 0 4px; font-size: 14px; align-items: baseline; }
  .res-grid .k { opacity: .6; white-space: nowrap; }
  .res-grid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .res-grid .v.left { text-align: left; font-size: 12.5px; line-height: 1.6; }
  .res-grid .v.big { font-size: 20px; font-weight: 700; }
  .res-grid .v.gold { color: #ffe7a6; }
  .res-grid.help { font-size: 13px; }
  .record { color: #ffd76a; font-weight: 700; }
  .money-up { color: #ffd76a; }
  .unlock { margin-top: 12px; padding: 9px 12px; border-radius: 9px; background: rgba(77,255,166,.1); border: 1px solid rgba(77,255,166,.35); font-size: 13px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 10px; cursor: pointer; color: var(--fg); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); font: 12px var(--font); }
  .swatch.sel { border-color: rgba(160,200,255,.9); background: rgba(80,130,230,.2); }
  .swatch.poor .sw-pr { color: #ff9a90; }
  .swatch .chip { width: 34px; height: 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); }
  .sw-pr { opacity: .75; font: 11px var(--num); }
  .up-row, .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 14px; }
  .pips i { display: inline-block; width: 14px; height: 5px; border-radius: 2px; margin-left: 3px; background: rgba(255,255,255,.18); vertical-align: middle; }
  .pips i.on { background: #5b8cff; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; overflow: hidden; flex-shrink: 0; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--fg); padding: 8px 11px; font: 12.5px var(--font); cursor: pointer; }
  .seg button.on { background: rgba(70,120,225,.9); }
  .range { display: flex; align-items: center; gap: 8px; } .range output { width: 28px; text-align: right; font: 12px var(--num); }
  .switch input { display: none; } .switch span { display: inline-block; width: 42px; height: 24px; border-radius: 12px; background: rgba(255,255,255,.18); position: relative; cursor: pointer; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: #4678e1; } .switch input:checked + span::after { transform: translateX(18px); }

  /* ---- 触屏操控 ---- */
  #touch-ui { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
  #touch-ui > * { pointer-events: auto; }
  .tc-joy { position: absolute; left: calc(22px + var(--sl)); bottom: calc(26px + var(--sb)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.2); touch-action: none; }
  .tc-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.5); }
  .tc-cluster { position: absolute; right: calc(16px + var(--sr)); bottom: calc(22px + var(--sb)); display: none; grid-template-columns: repeat(3, auto); gap: 10px; align-items: end; justify-items: center; }
  #touch-ui.drive .tc-drive, #touch-ui.walk .tc-walk { display: grid; }
  .tc-walk { grid-template-columns: repeat(2, auto); }
  .tc-btn { appearance: none; touch-action: none; border-radius: 50%; color: #fff; font: 600 13px var(--font); width: 66px; height: 66px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); }
  .tc-btn.on { background: rgba(255,255,255,.35); }
  .tc-gas { width: 82px; height: 82px; background: rgba(70,200,120,.25); border-color: rgba(120,255,170,.6); }
  .tc-brake { background: rgba(230,80,70,.22); border-color: rgba(255,140,130,.55); }
  .tc-hb { background: rgba(255,200,70,.2); border-color: rgba(255,220,120,.55); }
  .tc-small { width: 50px; height: 34px; border-radius: 10px; font-size: 12px; grid-row: 1; }
  .tc-drive .tc-small:first-child { grid-column: 2; } .tc-drive .tc-small:nth-child(2) { grid-column: 3; }
  .tc-drive .tc-hb { grid-row: 2; grid-column: 1; } .tc-drive .tc-brake { grid-row: 2; grid-column: 2; } .tc-drive .tc-gas { grid-row: 2; grid-column: 3; }
  body.touch #hint { display: none; }
  body.touch #speedo { left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--sb)); }
  body.touch #speed-num { font-size: 40px; }
  body.touch #drift-read { left: 50%; transform: translateX(-50%); bottom: calc(62px + var(--sb)); }
  body.touch #minimap { top: calc(56px + var(--st)); bottom: auto; width: 112px; height: 112px; }
  body.touch #objective { top: calc(176px + var(--st)); }
  body.touch.playing #fps { display: none; }

  body.in-title #hud, body.in-title #topright, body.in-title #hint { display: none; }

  /* ---- 窄屏：顶栏收进 ☰ ---- */
  @media (max-width: 820px), (max-height: 500px) {
    #menu-toggle { display: inline-block; }
    #hud .row { display: none; max-width: 300px; }
    #hud.expanded .row { display: flex; background: rgba(6,9,16,.75); padding: 8px; border-radius: 12px; }
    #hud .title small { display: none; }
    .t-logo { font-size: 46px; letter-spacing: 7px; }
    .panel-card { padding: 18px 16px; max-height: 94dvh; }
    .panel-card > .panel-actions { bottom: -18px; margin: 12px -16px -18px; padding: 10px 16px 14px; }
    #countdown { font-size: 96px; }
    .set-row { flex-wrap: wrap; }
  }
  @media (max-height: 500px) {
    .panel-card.p-title { max-height: 96dvh; }
    .t-hero .t-stats { margin: 10px 0 12px; }
    .t-menu { display: grid; grid-template-columns: 1fr 1fr; }
    .t-menu .big { grid-column: span 2; padding: 11px; }
    .tc-joy { width: 112px; height: 112px; }
    body.touch #objective { top: calc(50px + var(--st)); right: calc(136px + var(--sr)); min-width: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="title"><button id="menu-toggle" aria-label="菜单">≡</button>TOKYO <small>· 東京シティ・スケープ</small></div>
  <div class="row">
    <button id="btn-day">白天</button>
    <button id="btn-night">夜晚</button>
    <button id="btn-auto">昼夜循环</button>
    <div class="sep"></div>
    <button id="v-shibuya">涩谷</button>
    <button id="v-aerial">空中</button>
    <button id="v-bay">海湾</button>
    <button id="v-mtn">山村</button>
    <button id="v-tower">东京塔</button>
    <button id="v-skytree">晴空塔</button>
    <div class="sep"></div>
    <button id="m-orbit" class="on">观景</button>
    <button id="m-walk">散步</button>
    <button id="m-drive">驾驶</button>
    <div class="sep"></div>
    <button id="m-play" class="accent">玩法</button>
    <button id="m-garage">车库</button>
  </div>
</div>
<div id="topright">
  <span id="money">¥0</span>
  <button class="chip-btn" id="pause-btn" aria-label="暂停">II</button>
</div>
<div id="fps" hidden></div>
<div id="hint"></div>
<div id="nav" hidden><div id="nav-arrow">▲</div><div><div id="nav-label"></div><div id="nav-dist"></div></div></div>
<div id="toasts"></div>
<div id="speedo" hidden><span id="speed-num">0</span><span id="speed-unit">km/h</span></div>
<div id="drift-read">漂移 0</div>
<div id="objective" hidden>
  <div id="obj-title"></div>
  <div id="obj-sub"></div>
  <div id="obj-extra"></div>
  <div id="obj-timer">00:00.0</div>
</div>
<canvas id="minimap" width="336" height="336" hidden></canvas>
<div id="countdown"></div>

<div id="panel" hidden><div class="panel-card" id="panel-card"></div></div>

<div id="loading"><div>TOKYO を生成中…</div><div class="bar"></div></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#9fb4d8">需要启用 JavaScript 才能运行。</p></noscript>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script>
  // 运行期错误收集（自查用）
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message) + ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rej: ' + String(e.reason && e.reason.stack || e.reason)));
